name: Release

# Push a tag `v<version>` whose version equals `[workspace.package] version`
# in Cargo.toml. Each platform builds `openac` and `openac-launcher` in
# release mode and packages them; the last job writes `manifest.json` (the
# launcher's update feed, schema version 1) and publishes everything as one
# GitHub release.
#
# The launcher carries a fingerprint, one SHA-256 over what it is built from
# (the `fingerprint` job says what counts), and the release publishes it as
# launcher-fingerprint.json beside manifest.json. A launcher whose
# fingerprint matches the release's does not update itself; it only
# installs the new client. The release version alone changes nothing.
#
# Assets per platform (<rid> is win-x64, linux-x64 or osx-arm64):
#   openac-<rid>.zip    both programs, for players to download and unzip
#   client-<rid>.zip    `openac` at the root (the launcher's client payload)
#   launcher-<rid>.zip  `openac-launcher` at the root (its self-update payload)
# On macOS (osx-arm64, Apple silicon) the players' download is
# OpenAC-<version>-osx-arm64.zip, the ad-hoc signed OpenAC.app built by
# scripts/bundle-macos.sh, and launcher-osx-arm64.zip is the same file: the
# launcher there runs from OpenAC.app and its self-update replaces the bundle.
# Every zip carries LICENSE, NOTICE.md, THIRD-PARTY-LICENSES.html (the license
# of every Rust crate compiled into the programs, generated by cargo-about from
# about.toml and about.hbs) and the bundled fonts' licenses under licenses/
# (inside OpenAC.app, under Contents/Resources).
#
# A pull request that changes the release's own files, or a manual run, is a
# dry run: everything is built, packaged and checked and the manifest is
# written, but nothing is published.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-*.sh
      - about.toml
      - about.hbs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: check the tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read and compare the version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]/ { section = 1; next }
            /^\[/ { section = 0 }
            section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match the workspace version ${version} (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  fingerprint:
    name: the launcher's fingerprint
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show

      # The inputs: every package the launcher links on any platform (our
      # crates by their committed files apart from tests, benches and
      # examples; other crates by name, version and source; each with its
      # resolved features), the workspace's build settings without the
      # release version, the toolchain, the files embedded in it or shipped
      # beside it, and how it is built and packaged (this file and the macOS
      # bundle script). Files are read as git object ids from the commit, so
      # the value is the same on every runner and line-ending setting.
      - id: fingerprint
        name: Compute the fingerprint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $true

          $metadata = (cargo metadata --locked --format-version 1) -join '' |
            ConvertFrom-Json -AsHashtable -Depth 64
          $root = ($metadata.workspace_root -replace '\\', '/').TrimEnd('/') + '/'
          $packages = @{}
          foreach ($package in $metadata.packages) { $packages[$package.id] = $package }
          $nodes = @{}
          foreach ($node in $metadata.resolve.nodes) { $nodes[$node.id] = $node }

          # Normal and build dependencies, followed to the end; test-only
          # dependencies are not built into the launcher.
          $start = @($metadata.packages |
            Where-Object { $_.name -eq 'openac-launcher' -and $null -eq $_.source })[0].id
          $linked = [Collections.Generic.HashSet[string]]::new([string[]]@($start))
          $queue = [Collections.Generic.Queue[string]]::new([string[]]@($start))
          while ($queue.Count) {
            foreach ($dependency in $nodes[$queue.Dequeue()].deps) {
              $built = @($dependency.dep_kinds | Where-Object { $null -eq $_.kind -or $_.kind -eq 'build' })
              if ($built.Count -and $linked.Add($dependency.pkg)) { $queue.Enqueue($dependency.pkg) }
            }
          }

          $inputs = [Collections.Generic.List[string]]::new()
          foreach ($id in $linked) {
            $package = $packages[$id]
            $features = [string[]]@($nodes[$id].features)
            [Array]::Sort($features, [StringComparer]::Ordinal)
            if ($null -eq $package.source) {
              # Our crates and the patched copies under vendor/.
              $manifest = $package.manifest_path -replace '\\', '/'
              $directory = $manifest.Substring($root.Length, $manifest.Length - $root.Length - '/Cargo.toml'.Length)
              $entries = foreach ($line in git ls-tree HEAD -- "$directory/") {
                $fields, $path = $line -split "`t", 2
                $name = $path.Substring($directory.Length + 1)
                if ($name -notin 'tests', 'benches', 'examples') { "${name}:$(($fields -split ' ')[2])" }
              }
              $inputs.Add("path $directory [$($features -join ',')] $($entries -join ' ')")
            } else {
              $inputs.Add("crate $($package.name) $($package.version) $($package.source) [$($features -join ',')]")
            }
          }

          $section = ''
          $settings = foreach ($line in (git show 'HEAD:Cargo.toml') -replace "`r", '') {
            if ($line -match '^\[') { $section = $line }
            if ($line -match '^\s*(#|$)') { continue }
            if ($section -eq '[workspace.package]' -and $line -notmatch '^version\s*=') { $line }
            elseif ($section -like '`[profile.*') { $line }
          }
          $inputs.Add("cargo $($settings -join ' | ')")

          foreach ($path in 'rust-toolchain.toml', 'assets/icons', 'assets/fonts', 'LICENSE', 'NOTICE.md',
                            'about.toml', 'about.hbs', 'scripts/bundle-macos.sh', '.github/workflows/release.yml') {
            $inputs.Add("file $path $("$(git rev-parse "HEAD:$path")".Trim())")
          }

          $sorted = $inputs.ToArray()
          [Array]::Sort($sorted, [StringComparer]::Ordinal)
          $sorted | ForEach-Object { Write-Host $_ }
          $bytes = [Text.Encoding]::UTF8.GetBytes(($sorted -join "`n") + "`n")
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          Write-Host "launcher fingerprint: $fingerprint"
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT

  build:
    name: build (${{ matrix.rid }})
    needs: [version, fingerprint]
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            # The C runtime linked in, so players need no Visual C++
            # redistributable. Applied to the target only (--target below),
            # not to build scripts or proc macros.
            rustflags: -C target-feature=+crt-static
          - rid: linux-x64
            # The oldest supported hosted image, so the binaries run on
            # distributions with an older glibc.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ''
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Read by the launcher's build, not when it runs.
      OPENAC_LAUNCHER_FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libasound2-dev zip

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p openac -p openac-launcher

      - name: Smoke-test the binaries
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          "$bin/openac-launcher${{ matrix.exe }}" --verify-publish
          "$bin/openac${{ matrix.exe }}" --help > /dev/null
          # The launcher carries the release's fingerprint.
          grep -a -q -F "$OPENAC_LAUNCHER_FINGERPRINT" "$bin/openac-launcher${{ matrix.exe }}"

      - name: Install cargo-about
        shell: bash
        env:
          # A host tool: the release's static C runtime flag is not for it.
          RUSTFLAGS: ''
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      - name: Stage the license files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/common/licenses/egui-fonts
          cp LICENSE NOTICE.md staging/common/
          # Every crate compiled into the programs with its license text. A
          # license about.toml does not accept fails the release (--fail).
          cargo about generate --workspace --locked --fail \
            -c about.toml -o staging/common/THIRD-PARTY-LICENSES.html about.hbs
          test -s staging/common/THIRD-PARTY-LICENSES.html
          cp assets/fonts/NotoSans/OFL.txt staging/common/licenses/NotoSans-OFL.txt
          # The Linux window decorations' bundled Cantarell (compiled into both Linux programs).
          cp assets/fonts/Cantarell/OFL.txt staging/common/licenses/Cantarell-OFL.txt
          # The launcher's egui fonts: their license texts ship in the crate.
          fonts_manifest=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "epaint_default_fonts") | .manifest_path' \
            | head -n 1)
          # Forward slashes, so a Windows path also works in Git Bash.
          fonts_manifest=${fonts_manifest//\\//}
          fonts_dir="$(dirname "$fonts_manifest")/fonts"
          for file in OFL.txt UFL.txt Hack-Regular.txt emoji-icon-font-mit-license.txt; do
            cp "$fonts_dir/$file" staging/common/licenses/egui-fonts/
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $rid = '${{ matrix.rid }}'
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          $packages = @{
            "client-$rid"   = @('openac.exe')
            "launcher-$rid" = @('openac-launcher.exe')
            "openac-$rid"   = @('openac.exe', 'openac-launcher.exe')
          }
          foreach ($name in $packages.Keys) {
            $dir = "staging/$name"
            Copy-Item -Recurse staging/common $dir
            foreach ($exe in $packages[$name]) { Copy-Item "$bin/$exe" $dir }
            $zip = (Join-Path (Get-Location) "dist/$name.zip")
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path $dir).Path, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          }
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          bin="target/${{ matrix.target }}/release"
          mkdir -p dist
          package() {
            name=$1; shift
            cp -r staging/common "staging/$name"
            for exe in "$@"; do
              install -m 0755 "$bin/$exe" "staging/$name/$exe"
            done
            # Info-ZIP keeps the Unix modes, so the executables extract with
            # their execute bit, as the launcher's extractor requires.
            (cd "staging/$name" && zip -r -X -q "../../dist/$name.zip" .)
          }
          package "client-$rid" openac
          package "launcher-$rid" openac-launcher
          package "openac-$rid" openac openac-launcher
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    name: build (osx-arm64)
    needs: [version, fingerprint]
    # macos-latest is an Apple-silicon image; the bundle's minimum macOS is in
    # scripts/bundle-macos.sh (LSMinimumSystemVersion).
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Read by the launcher's build, not when it runs.
      OPENAC_LAUNCHER_FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show

      - name: Install cargo-about
        shell: bash
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      # Builds both programs, writes the license files into the bundle, signs
      # it ad hoc (Apple silicon runs no unsigned code; there is no Developer
      # ID, so Gatekeeper asks the player to allow a downloaded copy once),
      # smoke-tests the bundled programs and zips it with ditto.
      - name: Build and bundle OpenAC.app
        shell: bash
        run: sh scripts/bundle-macos.sh --target aarch64-apple-darwin

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rid=osx-arm64
          out="target/aarch64-apple-darwin/release/macos"
          bundle="$out/OpenAC.app"
          mkdir -p dist
          cp "$out/OpenAC-$VERSION-$rid.zip" dist/
          # The launcher's self-update payload is the bundle itself.
          cp "$out/OpenAC-$VERSION-$rid.zip" "dist/launcher-$rid.zip"
          # The client payload: the bundle's signed `openac` at the root, with
          # the same license files.
          staging="staging/client-$rid"
          mkdir -p "$staging"
          resources="$bundle/Contents/Resources"
          cp "$resources/LICENSE" "$resources/NOTICE.md" "$resources/THIRD-PARTY-LICENSES.html" "$staging/"
          cp -R "$resources/licenses" "$staging/"
          install -m 0755 "$bundle/Contents/MacOS/openac" "$staging/openac"
          codesign --verify --strict "$staging/openac"
          # Info-ZIP keeps the Unix modes, so `openac` extracts with its
          # execute bit, as the launcher's extractor requires.
          (cd "$staging" && zip -r -X -q "../../dist/client-$rid.zip" .)
          ls -l dist

      # What the launcher checks when it installs either payload: the bundle
      # at the top with Info.plist and an executable launcher, `openac` at the
      # client's root, both still signed after the round trip through zip.
      - name: Check the payloads
        shell: bash
        run: |
          set -euo pipefail
          rid=osx-arm64
          check="$RUNNER_TEMP/payload-check"
          rm -rf "$check"
          ditto -x -k "dist/launcher-$rid.zip" "$check/launcher"
          ditto -x -k "dist/client-$rid.zip" "$check/client"
          app="$check/launcher/OpenAC.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/openac-launcher"
          test -x "$app/Contents/MacOS/openac"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/openac-launcher" --verify-publish
          grep -a -q -F "$OPENAC_LAUNCHER_FINGERPRINT" "$app/Contents/MacOS/openac-launcher"
          test -x "$check/client/openac"
          test -s "$check/client/THIRD-PARTY-LICENSES.html"
          codesign --verify --strict "$check/client/openac"
          "$check/client/openac" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-osx-arm64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [version, fingerprint, build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The launcher reads this strictly (crates/ac-launcher-core/src/updates/manifest.rs):
      # exactly these members, strict SemVer versions, a minimum launcher
      # version no newer than the release, HTTPS URLs, lowercase SHA-256 and a
      # size in bytes for each payload, keyed by runtime identifier. The
      # minimum is the release itself: a launcher older than the release
      # updates itself before it installs the new client, unless its
      # fingerprint matches the release's (launcher-fingerprint.json).
      - name: Write manifest.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact() {
            file="dist/$1"
            jq -n --arg url "$BASE_URL/$1" \
                  --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                  --argjson size "$(stat -c %s "$file")" \
                  '{url: $url, sha256: $sha256, size: $size}'
          }
          clients='{}'
          launchers='{}'
          for rid in win-x64 linux-x64 osx-arm64; do
            clients=$(jq --arg rid "$rid" --argjson a "$(artifact "client-$rid.zip")" '. + {($rid): $a}' <<< "$clients")
            launchers=$(jq --arg rid "$rid" --argjson a "$(artifact "launcher-$rid.zip")" '. + {($rid): $a}' <<< "$launchers")
          done
          jq -n --arg version "$VERSION" \
                --argjson clients "$clients" \
                --argjson launchers "$launchers" \
                '{schemaVersion: 1, version: $version, minimumLauncherVersion: $version,
                  clients: $clients, launchers: $launchers}' > dist/manifest.json
          cat dist/manifest.json

      # Beside manifest.json, not in it: a launcher from before fingerprints
      # reads manifest.json strictly and would refuse a member it does not
      # know. Read strictly too: these members only.
      - name: Write launcher-fingerprint.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg version "$VERSION" --arg fingerprint "$FINGERPRINT" \
                '{schemaVersion: 1, version: $version, fingerprint: $fingerprint}' \
                > dist/launcher-fingerprint.json
          cat dist/launcher-fingerprint.json
          (cd dist && sha256sum *.zip manifest.json launcher-fingerprint.json > SHA256SUMS.txt)

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "openac-rust $TAG" \
            --generate-notes \
            "${flags[@]}"
