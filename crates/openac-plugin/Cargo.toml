[package]
name = "openac-plugin"
description = "The SDK for openAC plugins: write a plugin as an ordinary Rust crate, build it for wasm32-unknown-unknown, and test it natively against a fake host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# MIT, so plugins under any licence can use it.
license = "MIT"

[features]
# Typed service requests and replies as JSON (`Host::register_service`,
# `Host::call_service`). Off by default: a plugin that does not use them
# builds neither serde nor serde_json, and its lock file does not change.
json = ["dep:serde", "dep:serde_json"]

[dependencies]
ac-plugin-abi.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Natively the fake host keeps plugin UI exactly as the client does (the same
# state and the same import handling), so a plugin's markup and bindings are
# checked by its own cargo test. Not in a plugin's wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ac-plugin-abi = { workspace = true, features = ["ui-host"] }
ac-plugin-ui.workspace = true

[dev-dependencies]
# The SDK's own tests cover the `json` feature.
openac-plugin = { path = ".", features = ["json"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
