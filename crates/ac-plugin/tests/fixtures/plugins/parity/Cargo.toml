[package]
name = "parity"
description = "The host-parity harness's scripted plugin: relays any client function call a test names and logs every event and callback, so the same script runs in a session with a window and in one without."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openac-plugin = { path = "../../../../../openac-plugin" }
# The import table, to relay a call by its import name.
ac-plugin-abi = { path = "../../../../../ac-plugin-abi" }
