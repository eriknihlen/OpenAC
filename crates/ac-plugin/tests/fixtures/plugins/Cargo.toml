# The test plugins, built to wasm by `ac_plugin::fixtures::build_plugins`
# (tests only). Their own workspace, so the client's workspace never builds
# them natively and they get the plugin build profile below.
[workspace]
members = ["hello", "probe", "misbehave", "uidemo", "fetcher", "parity", "rawbytes", "suite"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
# A panic is a trap: the client unloads the plugin and reports why.
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
