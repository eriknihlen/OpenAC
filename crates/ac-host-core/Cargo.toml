[package]
name = "ac-host-core"
description = "What the client and the launcher share about a process: the session-config document, paths and the install layout, the status file, the strict JSON reader, the local time zone, exit codes and the install lease. Pure; I/O only where named."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# The local time zone on Windows (`SystemTimeToTzSpecificLocalTime`); no C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[lints]
workspace = true
